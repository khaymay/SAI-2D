name: SAI 2D Prediction Engine

on:
  push:
    branches:
      - main
    paths:
      - "data/draws.csv"
      - "scripts/run_pipeline.py"
  workflow_dispatch:

concurrency:
  group: sai-2d-engine
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --only-binary=:all: -r requirements.txt

      - name: Run 5-Model Digit-First Prediction Pipeline
        env:
          TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
        run: |
          python scripts/run_pipeline.py

      - name: Commit updated predictions
        run: |
          git config user.name "SAI 2D Bot"
          git config user.email "actions@github.com"
          git add data/draws.csv data/predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update SAI 2D predictions [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
