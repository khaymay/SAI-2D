name: SAI 2D Prediction Engine

on:
  push:
    branches:
      - main
    paths:
      - "data/draws.csv"
      - "data/predictions.json"
      - "scripts/run_pipeline.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 5-Model Digit-First Prediction Pipeline
        env:
          TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
        run: |
          python scripts/run_pipeline.py

      - name: Commit updated predictions
        run: |
          git config user.name "SAI 2D Bot"
          git config user.email "actions@github.com"
          git add data/draws.csv data/predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update SAI 2D predictions [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
